seed: 42

model:
  base_model: Qwen/Qwen3-8B
  trust_remote_code: false
  attn_implementation: sdpa

data:
  # Reuse the already-built, verify_ready-passing corpus from the sibling IQ project
  # (single_only G*, 2667 source rows, 470 edges, 6602 train rows) instead of
  # re-running prepare + HF download. ~15MB, already on disk.
  prepared_dir: /home/user1/SG/IQ/artifacts/prepared
  # Only used by the `prepare` step, which is now skipped; kept on hdd3 (home disk ~100% full).
  hf_cache_dir: /mnt/hdd3/user1/EQ_csreg/hf_datasets_cache
  permutation_copies: 1
  include_graph_synthetic: true
  # Recommended: build canonical G* from the metadata-complete single-answer subset.
  # The public multi-answer subset lacks asset/relevancy metadata and is not used
  # as a graph source unless explicitly changed to single_plus_multi.
  graph_source_mode: single_only

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

csreg:
  projector_rank: 64
  projector_scale: 0.10
  lambda_signature: 0.02
  lambda_reconstruction: 0.005
  lambda_positive: 0.01
  lambda_nonedge: 0.02
  nonedge_margin: 0.15

# Option-Content Listwise SFT. Set enabled=false (or lambda_listwise=0) to fall
# back to the plain "<answer>C</answer>" label style + pure CSReg for ablation.
listwise:
  enabled: true
  answer_style: label_content   # "label" | "label_content"
  lambda_listwise: 1.0
  temperature: 0.1

training:
  # Home disk (/) sits at ~97% (30G free); training checkpoints/adapters live on
  # hdd3 so a run never fills the root filesystem. Keep eval/submit pointed here too.
  output_dir: /mnt/hdd3/user1/EQ_csreg_listwise_qwen3_8b
  max_length: 768
  epochs: 2.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  learning_rate: 0.00008
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  max_grad_norm: 0.5
  optim: paged_adamw_8bit
  logging_steps: 10
  save_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 2
  report_to: none

inference:
  # 4bit Qwen3-8B uses only ~9GB of 40GB during generation, so batch 32 is safe
  # and ~4x fewer batches than 8. max_new_tokens kept at 192 so the longer
  # label_content answer block (think + <label> + <content>) is never truncated.
  batch_size: 32
  tta_permutations: 3
  max_new_tokens: 192
