seed: 42

# Strict prompt (§6-8e). The competition test input has only passage/question/
# options, so asset/direction/polarity/anchor must not appear in the prompt —
# they stay training-only side information (graph construction, CSReg/listwise
# spans). The anchor span is recovered by locating the anchor string inside the
# visible question/passage text, so structural supervision is unchanged.
# Adapters record this in csreg_config.json; eval/submit auto-restore it, so
# older non-strict adapters keep the old format.
prompt:
  strict: true
  # strict_target (IQ2): the same policy on the OUTPUT side. The <think> target
  # otherwise names row.asset/row.anchor and branches on direction/polarity —
  # training the model to emit text it cannot ground at test time, where none of
  # those fields exist. false reproduces the B2/C_matrix adapters.
  strict_target: true

model:
  base_model: Qwen/Qwen3-8B
  trust_remote_code: false
  attn_implementation: sdpa

data:
  # val/test contain NO questions below four options; train is 25.6% two- and
  # three-option rows. They cannot be grown (the anchor's degree IS the option
  # count), so they are dropped and the pattern matrix re-covers those anchors.
  min_option_count: 4
  # Reshuffle option order in place every epoch. Distinct from the rejected
  # static permutation COPIES (24 #5): corpus size is unchanged and no item is
  # ever seen twice in the same order.
  dynamic_permutation: true
  # Reuse the already-built, verify_ready-passing corpus from the sibling IQ project
  # (single_only G*, 2667 source rows, 470 edges, 6602 train rows) instead of
  # re-running prepare + HF download. ~15MB, already on disk.
  # Training-corpus paths from the machine this adapter was trained on. Inference
  # never reads them; they are kept so the training recipe stays documented.
  prepared_dir: artifacts/prepared
  hf_cache_dir: artifacts/hf_datasets_cache
  permutation_copies: 1
  include_graph_synthetic: true
  # Recommended: build canonical G* from the metadata-complete single-answer subset.
  # The public multi-answer subset lacks asset/relevancy metadata and is not used
  # as a graph source unless explicitly changed to single_plus_multi.
  graph_source_mode: single_only

lora:
  # Capacity, single variable vs run N. The pairwise probe (CODE_SPEC 33) split
  # run N's errors into 39.5% interference (gold wins head-to-head but loses in
  # the full option set) and 41.9% genuine gaps -- interference is the classic
  # symptom of too little capacity, and the corpus grew 14,163 -> 24,655 rows
  # (+74%) while trainable stayed at 1.06%.
  # target_modules is already every linear layer (attention + all three MLP
  # projections), which is what peft's "all-linear" resolves to on Qwen3, so
  # rank is the only handle left short of lm_head / embeddings.
  r: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

csreg:
  projector_rank: 64
  projector_scale: 0.10
  # REPLACEMENT MODE: the local pairwise structural terms are switched off and the
  # adjacency-conditioned matrix objective below carries the whole structural
  # signal. The projector itself stays alive because listwise still uses it.
  # Restore 0.2/0.05/0.1/0.2 to run matrix ADDITIVE to local (the IQ2 recipe).
  lambda_signature: 0.0
  lambda_reconstruction: 0.0
  lambda_positive: 0.0
  lambda_nonedge: 0.0
  nonedge_margin: 0.15

# C: adjacency-conditioned matrix regression (regression_csreg/DESIGN_GUIDE.md,
# ported from the IQ2 run). Each node representation must be predictable from the
# weighted set of its neighbours on the other side of the bipartite graph, plus a
# closed-form penalty on the reconstruction's sensitivity to adjacency entries.
# This is the ACTIVE line of work; the previous local-CSReg recipe is preserved
# verbatim in a100_40gb_B_strict.yaml (same test 0.860) for A/B comparison.
# lambda_matrix: 0.0 disables the objective entirely.
matrix_csreg:
  # Calibrated on the smoke run (CODE_SPEC 12-6a). Measured matrix loss 0.0497 of a
  # 4.611 total, so:
  #   0.01 (IQ2 value) -> 0.011% of total   : drowned
  #   0.1              -> 0.108% of total   : right only if local CSReg is KEPT
  #   2.7              -> 2.91%  of total   : matches the 2.93% budget local held
  # Under replacement the matrix term is the only structural signal, so it must
  # inherit local's budget - 6-6c showed 0.3% gets drowned by LM + listwise.
  # Three defects fixed at once (CODE_SPEC 35). The SSE form has a trivial global
  # minimum -- make every feature identical and the identity map reconstructs it
  # -- because it only ever uses POSITIVE edges. The observed non-edges are
  # already sampled and encoded, then multiplied by a zero weight and discarded.
  # And nodes are encoded without their asset, so one "vibration" vector has to
  # satisfy every asset that lists it, which for the 23 cross-asset disagreement
  # pairs (29-1) is a contradiction.
  #
  #   contrastive          rank the true neighbourhood above the observed false
  #                        one. Collapse now costs log(1+k); the minimum is 0.
  #   asset_conditioned    "In the electric motor, sensor: vibration"
  #   include_components   a component's row is the union of its failure modes'
  #                        rows (30-1), so the same machinery reaches that layer
  #
  # lambda re-derived by smoke, as 2-4 requires whenever the objective changes.
  # InfoNCE starts near log(1+k) for k negatives, so it measured 2.24 where SSE
  # measured 0.023 -- two orders apart. 0.027 puts it at 3% of the total, the
  # same share run P had.
  lambda_matrix: 0.0
  reconstruction_mode: contrastive
  temperature: 0.1
  asset_conditioned_nodes: true
  include_components: true
  # Removed (§13-7): measured inert on both EQ and IQ2 — 6.9e-06 / 9.2e-06, and
  # exactly 0.0 at convergence in run D. It never contributed gradient while
  # costing a full closed-form gradient evaluation, so the term is now skipped.
  sensitivity_weight: 0.0
  structural_dim: 128
  projection_seed_offset: 17
  failure_rows_per_step: 4
  sensor_rows_per_step: 4
  nonedges_per_row: 4
  max_node_length: 48
  node_encode_batch_size: 16

# Graph-constrained hard option augmentation.
# Accuracy degrades as option count grows (§11-1c: 97.3% at slot 0 -> 78.1% at
# slot 5) but the corpus is thin at 7-8 options. This resizes existing rows using
# distractors that G* has EXPLICITLY labelled for the anchor — observed non-edges
# for positive questions, real edges for negative ones. Unobserved pairs are never
# used: "absent from G*" and "known to be unrelated" are different claims.
# Hardness is graph topology (neighbourhood Jaccard against the gold), never
# lexical similarity, which would let surface wording override the graph.
option_augmentation:
  enabled: true
  # V3 card C1: regenerate the variants every epoch instead of replaying
  # the materialized ones. Corpus size, step count and wall clock all match
  # run I -- the only change is whether epoch 2 repeats epoch 1's draw.
  mode: dynamic
  # REG2 오답 27개 중 25개에서 gold 가 2등이었다(격차 0.927, 정답행 0.951).
  # 쉬운 보기는 이미 거른다. 훈련된 적 없는 것은 마지막 2지선다다.
  target_counts: [2, 3, 4, 6, 8]
  # 늘리기만 하면 2,3 은 절대 생성되지 않는다(grow 가 항상 우선).
  shrink_fraction: 0.35
  # run I: 2 independent hard-distractor draws per source row (was 1). E proved
  # option augmentation is the one net-positive axis (§15-1: 7-option +11.6pp);
  # this doubles the DIVERSITY of large-option variants the model sees, not just
  # the count. Each draw picks different hard/random distractors (§14-3), so it is
  # closer to "different data each pass" than a plain repeat. NOTA stays OFF: run H
  # showed NOTA is zero-sum at 8B (trades relational sharpness for NOTA, §H).
  copies_per_row: 2
  # Only half the additions are top-ranked. Filling every slot with maximal
  # hardness overfits to small topology differences and makes one graph error
  # catastrophic; the remainder are random graph-valid entities.
  hard_fraction: 0.5
  # Cap on how often one entity may be reused, as a fraction of eligible rows,
  # so high-degree hubs do not become a shortcut feature.
  max_reuse_fraction: 0.25

# B-1: dense relation-fact distillation (closed-book — G* must live in weights).
# One compact yes/no item per (asset, fm, sensor) pair; LM loss only.
relation_fact:
  enabled: true
  both_directions: true   # fm->sensor and sensor->fm phrasing
  repeats: 1              # raise to drill the table harder

# Option-Content Listwise SFT. Set enabled=false (or lambda_listwise=0) to fall
# back to the plain "<answer>C</answer>" label style + pure CSReg for ablation.
listwise:
  enabled: true
  answer_style: score   # "label" | "label_content"
  lambda_listwise: 0.0
  # 답을 생성하지 않고 채점한다. 학습이 최적화하는 양과 추론이 쓰는 양이 같다.
  lambda_option_score: 1.0
  option_score_temperature: 1.0
  # 측정: top1-top2 확률 격차 중앙값 1.000 -- 분포 포화. 틀리는 문항에서도
  # 최대 확신을 낸다. 스무딩은 K=5에서 손실 바닥을 0.223으로 올려 몰빵을 막는다.
  option_label_smoothing: 0.05
  temperature: 0.1
  # --- Abstention (NOTA) ---
  # include_nota_synthetic: add G*-derived rows whose gold is "None of the above"
  #   (every option is a non-edge of the anchor) -> teaches the LM to emit NOTA.
  # abstain_gate: learned predictor-rejector logit inside the listwise softmax
  #   (max/mean/top1-top2 of real scores -> abstain logit). Set both false to
  #   reproduce the pre-NOTA listwise baseline.
  # ---- NOTA-GOLD ROWS BACK ON ----
  # The only signal measured above the noise floor. Splitting val by whether the
  # row offers "None of the above" gives, on every one of six runs:
  #     NOTA rows (279)  93.6-96.1%     no-NOTA rows (963)  98.4-99.3%
  # a 3-5pp gap in one direction -- the model picks NOTA when a real answer is
  # listed (14 of PAIR's 24 errors) far more than it misses a true NOTA (3).
  # Binomial SE on 1242 rows at 98% is +-0.4pp and the six runs span 0.48pp, so
  # every augmentation change so far was inside the noise; this gap is not.
  # abstain_gate stays false: it is a head, and the score paradigm reads the LM's
  # own letter logits, so a head would reintroduce the train/inference gap.
  include_nota_synthetic: true
  nota_options_per_question: 5
  nota_per_anchor: 1
  abstain_gate: false
  # Distractor policy for the NOTA/calibration generators (§13-8). Inert while the
  # switches above are false; kept so re-enabling reproduces D's sampling exactly.
  nota_explicit_nonedges_only: false
  nota_hard_fraction: 0.5
  include_answerable_nota_synthetic: true
  answerable_nota_per_anchor: 1

training:
  # Where a re-training run would write. The submitted adapter is already
  # unpacked at <kit>/adapter, which is what eq_predictor.py loads by default.
  output_dir: runs/eq_nota_gen
  max_length: 768
  epochs: 2.0
  # 8x8 (IQ2 setting) instead of 4x16. Effective batch is 64 either way, so the
  # optimization is unchanged — but the matrix objective runs once per MICRO-batch,
  # so halving the micro-batch count halves its cost (~18s -> ~9s per step,
  # roughly 45 min off a 306-step run). Raises activation/logits memory by ~3GB.
  # DDP over 4 GPUs: 8 x 2 x 4 = 64 effective (same as every run since B2).
  per_device_train_batch_size: 8
  # World size this config is meant to run at. Effective batch is
  # micro x accum x nproc and must stay 64 (tests/test_config_invariants.py).
  nproc: 2
  gradient_accumulation_steps: 4   # 8 x 4 x 2 ranks = 64
  learning_rate: 0.00006
  weight_decay: 0.05
  warmup_ratio: 0.10
  lr_scheduler_type: cosine
  max_grad_norm: 0.5
  optim: paged_adamw_8bit
  logging_steps: 10
  # NEFTune: 임베딩 노이즈. R-Drop 은 LoRA 경로에만 걸려 8.6e-04 로 무력했다.
  # 상수 5.0 은 epoch 0.31 이후 효과가 사라졌다(lm 이 비정규화 run 과 같아짐).
  # 암기가 일어나는 후반으로 노이즈를 옮긴다.
  neftune_noise_alpha: 1.0
  neftune_noise_alpha_final: 10.0
  # fuseblk 저장이 1.1MB/s라 중간 체크포인트가 학습시간을 지배했다.
  # 최종 어댑터는 trainer.save_model()이 따로 저장한다.
  save_strategy: "no"
  save_steps: 100
  save_total_limit: 2
  dataloader_num_workers: 2
  report_to: none

inference:
  # 4bit Qwen3-8B uses only ~9GB of 40GB during generation, so batch 32 is safe
  # and ~4x fewer batches than 8. max_new_tokens kept at 192 so the longer
  # label_content answer block (think + <label> + <content>) is never truncated.
  batch_size: 128
  tta_permutations: 3
  max_new_tokens: 192

# Pattern-matrix synthesis (CODE_SPEC 27). Enumerates every question shape G*
# can support instead of growing existing rows, so the shapes that exist in
# val/test but not in train are covered explicitly.
pattern_matrix:
  enabled: true
  option_counts: [4, 5, 6, 7, 8]
  per_cell: 1
  # Phrase synthetic questions using the corpus's own 57 templates instead of
  # four hard-coded sentences. Without this the matrix is a template monoculture.
  use_corpus_phrasing: true
  hard_fraction: 0.5
  # Foreign filler is applied to POSITIVE patterns only: an entity from another
  # asset is a valid wrong answer to "which IS relevant", but would be a second
  # CORRECT answer to "which is NOT relevant".
  allow_foreign_filler: true
  max_foreign_fraction: 0.5
  # This share applies WITHIN the emitted pattern rows, which are then diluted by
  # the rest of the corpus -- at 0.20 the finished training set was only 2.4%
  # NOTA-bearing against val's 22.5% and test's 10.0%. Left unset, the full
  # matrix lands the finished corpus at ~17%, between the two. train.py prints
  # the realised corpus-level share so this stays honest.
  target_nota_share: null
  max_rows: null

# Composite-anchor synthesis (CODE_SPEC 28-6 / card C8). Two anchors at once:
# AND  = both abnormal, gold explains both      (gold in the intersection)
# DIFF = one abnormal one not, gold explains one (gold in the difference)
# These cannot be answered by looking one row up in a memorised table, and the
# hard distractors are structural: for AND an entity explaining exactly one
# anchor, for DIFF an entity in the intersection.
composite_anchor:
  enabled: true
  option_counts: [4, 5, 6, 7, 8]
  per_cell: 1
  hard_fraction: 0.7
  # Caps the pair explosion; pairs are shuffled first so the cap is not biased.
  max_pairs_per_asset: 40


# Cross-asset contrast emphasis (CODE_SPEC 29 / card C10). Transfer between
# assets is 89.4% correct, and run I scores 79.17% where it is not. The pairs are
# already in the corpus 4,468 times; this repeats only those, adding no new facts.

# World-knowledge general rows, added on top of the NOTA run so the two differ by
# exactly this block. Both generators tag question_type=multi_choice_question_
# answering, so the router sends the test's 290 general items to this adapter.
general_from_graph:
  # G* edges re-voiced as test-style prose. Carries asset/anchor/direction, so
  # these flow through augment_option_counts_from_graph like relational rows.
  enabled: true
  negative_fraction: 0.25
  hard_fraction: 0.6
general_from_documents:
  # PDF atoms plus 41 curated mechanism atoms written over G* vocabulary; 38 of
  # them name a pair that is an actual G* edge. The doc_*_affirm families train
  # the specific judgement the measurement above says is broken: a true option is
  # present, so do not abstain.
  enabled: true
  copies_per_atom: 3
  affirmation_fraction: 0.25
  nota_true_fraction: 0.10
  surface_variation_fraction: 0.30

surface_variation:
  # Additive copies with a uniform sensor surface style ("vibration" ->
  # "vibration data"). The corpus otherwise teaches one string per concept, and
  # that narrowness is what let the model collapse into a G* lookup table.
  # Originals are kept: the benchmark phrasing has to stay dominant.
  enabled: true
  per_row: 1
